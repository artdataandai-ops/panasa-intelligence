# ============================================================================
#  Panasa Intelligence — HOST nginx (TLS termination)
#
#  Goes on the SERVER's nginx, NOT inside the container. It terminates HTTPS on
#  :7777 for ai.arttechgroup.com and reverse-proxies to the Docker frontend
#  container (published on 127.0.0.1:4770 by docker-compose.yml).
#
#      Public URL:  https://ai.arttechgroup.com:7777/panasa-intelligence/
#
#      browser ──TLS:7777──► host nginx ──► 127.0.0.1:4770 (frontend container)
#                                              ├─ SPA            /panasa-intelligence/
#                                              └─ /api ──► backend:3000 (Lyzr proxy)
#
#  Install (Linux):
#      sudo cp nginx-host.conf /etc/nginx/conf.d/panasa-intelligence.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#  The /panasa-intelligence prefix is preserved end-to-end (the container is
#  built with --base-href=/panasa-intelligence/), so this is a clean pass-through
#  with no path rewriting.
# ============================================================================

server {
    listen 7777 ssl;
    listen [::]:7777 ssl;
    http2 on;                       # nginx < 1.25.1: drop this line and use `listen 7777 ssl http2;`

    server_name ai.arttechgroup.com;

    # --- TLS (Let's Encrypt example; point these at your real cert) -----------
    ssl_certificate     /etc/letsencrypt/live/ai.arttechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.arttechgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Agent messages are small JSON payloads.
    client_max_body_size 2M;

    # --- App: pass /panasa-intelligence/* straight through to the container ---
    # No trailing path on proxy_pass => the full URI (prefix included) is
    # forwarded unchanged, which is exactly what the container expects.
    location /panasa-intelligence/ {
        proxy_pass         http://127.0.0.1:4770;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # tells the app it's HTTPS
        # Agent calls hit an LLM upstream (client times out at 60s); give headroom.
        proxy_connect_timeout 75s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
    }

    # Land the bare host on the app.
    location = / {
        return 302 /panasa-intelligence/;
    }
}

# Optional: redirect plain HTTP on 7777-adjacent ports to HTTPS. A single port
# can't serve both HTTP and HTTPS, so if you also expose :80, redirect it here:
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name ai.arttechgroup.com;
#     return 301 https://$host:7777$request_uri;
# }
