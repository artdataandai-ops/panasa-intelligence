server {
    listen 8080;
    server_name _;

    # Emit relative redirects so the bare-host redirect keeps the client's
    # original host:port (e.g. :7777) instead of nginx's internal :8080.
    absolute_redirect off;

    # Agent messages are small JSON payloads; keep the body cap tight.
    client_max_body_size 2M;

    # --- API: strip /art-intelligence and forward to the Node proxy ---
    location /art-intelligence/api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Agent calls hit an LLM upstream; the Angular client times out at 60s,
        # so give the proxy a little more headroom than that.
        proxy_connect_timeout 75s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
    }

    # --- Backend health (used by deploy.sh) -> backend:3000/healthz ---
    location = /art-intelligence/healthz {
        proxy_pass http://backend:3000/healthz;
    }

    # --- Static SPA under /art-intelligence/ ---
    location /art-intelligence/ {
        alias /usr/share/nginx/html/art-intelligence/;
        try_files $uri $uri/ /art-intelligence/index.html;
    }

    # Convenience redirect so the bare host lands on the app.
    location = / {
        return 302 /art-intelligence/;
    }
}
